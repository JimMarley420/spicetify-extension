version: 2.1

parameters:
  run_ci:
    type: boolean
    default: true
  run_deps_update:
    type: boolean
    default: false
  run_release:
    type: boolean
    default: false
  skip_heavy:
    type: boolean
    default: false

commands:
  restore-deps:
    steps:
      - restore_cache:
          keys:
            - v1-deps-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-{{ checksum "deno.lock" }}
            - v1-deps-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-
            - v1-deps-
  save-deps:
    steps:
      - save_cache:
          key: v1-deps-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-{{ checksum "deno.lock" }}
          paths:
            - ~/.cache/deno
            - node_modules

jobs:
  lint:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run: deno task lint
      - save-deps

  typecheck:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run: deno task typecheck
      - save-deps

  test:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run: mkdir -p test-results
      - run: deno task test
      - run:
          name: Generate LCOV coverage report
          command: deno coverage --lcov --output=coverage.lcov coverage/ && deno task coverage:check
          when: always
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage.lcov
          destination: coverage.lcov
      - save-deps

  theme-check:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run: deno task theme:check
      - save-deps

  theme-lint:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run: deno task theme:lint
      - save-deps

  manifest-check:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run: deno task manifest:check
      - save-deps

  ci-cd-check:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run:
          name: Check CI/CD files and referenced tasks
          command: |
            deno eval '
              const owner = Deno.env.get("CIRCLE_PROJECT_USERNAME")!;
              const repo = Deno.env.get("CIRCLE_PROJECT_REPONAME")!;
              const pullRequest = Deno.env.get("CIRCLE_PULL_REQUEST");
              const baseUrl = `https://api.github.com/repos/${owner}/${repo}`;
              const headers = { Accept: "application/vnd.github+json", "User-Agent": "artist-search-circleci" };
              const files: string[] = [];

              if (pullRequest) {
                const number = pullRequest.split("/").pop();
                for (let page = 1; ; page++) {
                  const response = await fetch(`${baseUrl}/pulls/${number}/files?per_page=100&page=${page}`, { headers });
                  if (!response.ok) throw new Error(`GitHub PR files API returned ${response.status}: ${await response.text()}`);
                  const pageFiles = await response.json();
                  files.push(...pageFiles.map((file: { filename: string }) => file.filename));
                  if (pageFiles.length < 100) break;
                }
              } else {
                const sha = Deno.env.get("CIRCLE_SHA1")!;
                const response = await fetch(`${baseUrl}/commits/${sha}`, { headers });
                if (!response.ok) throw new Error(`GitHub commit API returned ${response.status}: ${await response.text()}`);
                const commit = await response.json();
                files.push(...commit.files.map((file: { filename: string }) => file.filename));
              }

              const relevant = files.some((path) => /^\.circleci\//.test(path) || /^tasks\//.test(path) || path === "deno.json");
              if (!relevant) {
                console.log("No CI/CD files changed; skipping focused checks.");
                Deno.exit(0);
              }
              const config = JSON.parse(await Deno.readTextFile("deno.json"));
              const required = ["lint", "typecheck", "test", "theme:check", "theme:lint", "manifest:check", "build", "release"];
              const missing = required.filter((task) => !config.tasks?.[task]);
              if (missing.length) throw new Error(`Missing Deno tasks: ${missing.join(", ")}`);
              console.log("CI/CD files changed; all referenced tasks exist.");

              const child = new Deno.Command("deno", { args: ["task", "typecheck"], stdout: "inherit", stderr: "inherit" }).spawn();
              const result = await child.status;
              if (!result.success) throw new Error(`Deno typecheck failed with exit code ${result.code}`);
            '
      - save-deps

  build:
    resource_class: medium
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - run:
          name: Build extension
          command: deno task release --skip-check
      - save-deps
      - persist_to_workspace:
          root: .
          paths:
            - dist

  update-dist:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - attach_workspace:
          at: .
      - run:
          name: Update dist on same-repository pull requests
          command: |
            deno eval '
              const owner = Deno.env.get("CIRCLE_PROJECT_USERNAME")!;
              const repo = Deno.env.get("CIRCLE_PROJECT_REPONAME")!;
              const token = Deno.env.get("GITHUB_TOKEN");
              const pullRequest = Deno.env.get("CIRCLE_PULL_REQUEST");
              if (!pullRequest) {
                console.log("Not a pull request; dist is available as a build artifact.");
                Deno.exit(0);
              }
              if (!token) {
                console.log("GITHUB_TOKEN unavailable; keeping dist as an artifact only.");
                Deno.exit(0);
              }

              const api = `https://api.github.com/repos/${owner}/${repo}`;
              const headers = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" };
              const request = async (path: string, init?: RequestInit) => {
                const response = await fetch(`${api}${path}`, { ...init, headers: { ...headers, ...init?.headers } });
                const text = await response.text();
                if (!response.ok) throw new Error(`GitHub API ${path} returned ${response.status}: ${text}`);
                return text ? JSON.parse(text) : null;
              };

              const number = pullRequest.split("/").pop();
              const pr = await request(`/pulls/${number}`);
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
                console.log("Pull request comes from a fork; dist is available as an artifact only.");
                Deno.exit(0);
              }

              const changedPaths: string[] = [];
              for (let page = 1; ; page++) {
                const response = await fetch(`${api}/pulls/${number}/files?per_page=100&page=${page}`, { headers });
                if (!response.ok) throw new Error(`GitHub PR files API returned ${response.status}: ${await response.text()}`);
                const pageFiles = await response.json();
                changedPaths.push(...pageFiles.map((file: { filename: string }) => file.filename));
                if (pageFiles.length < 100) break;
              }
              const buildInputsChanged = changedPaths.some((path) =>
                path.startsWith("extensions/") ||
                path.startsWith("shared/") ||
                ["tasks/pluginInlineCSS.ts", "tasks/reactCompilerPlugin.ts", "tasks/spicetifyShimsPlugin.ts", "deno.lock"].includes(path)
              );
              if (!buildInputsChanged) {
                console.log("No extension or build inputs changed; dist remains untouched.");
                Deno.exit(0);
              }
              if (pr.head.sha !== Deno.env.get("CIRCLE_SHA1")) {
                console.log("Pull request changed during this build; dist is available as an artifact only.");
                Deno.exit(0);
              }

              const branch = pr.head.ref as string;
              const ref = await request(`/git/ref/heads/${branch}`);
              if (ref.object.sha !== pr.head.sha) {
                console.log("Pull request branch moved during this build; dist is available as an artifact only.");
                Deno.exit(0);
              }

              const commit = await request(`/git/commits/${pr.head.sha}`);
              const tree = await request(`/git/trees/${commit.tree.sha}?recursive=1`);
              if (tree.truncated) throw new Error("Repository tree is too large to safely update dist.");

              const files: { path: string; bytes: Uint8Array }[] = [];
              const walk = async (directory: string, prefix: string) => {
                for await (const entry of Deno.readDir(directory)) {
                  const localPath = `${directory}/${entry.name}`;
                  const repoPath = `${prefix}/${entry.name}`;
                  if (entry.isDirectory) await walk(localPath, repoPath);
                  else if (entry.isFile) files.push({ path: repoPath, bytes: await Deno.readFile(localPath) });
                }
              };
              await walk("dist", "dist");
              const desiredPaths = new Set(files.map((file) => file.path));
              const entries: Record<string, unknown>[] = [];
              const encodeBase64 = (bytes: Uint8Array) => {
                let binary = "";
                for (let offset = 0; offset < bytes.length; offset += 0x8000) {
                  binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
                }
                return btoa(binary);
              };

              for (const file of files) {
                const blob = await request("/git/blobs", { method: "POST", body: JSON.stringify({ content: encodeBase64(file.bytes), encoding: "base64" }) });
                entries.push({ path: file.path, mode: "100644", type: "blob", sha: blob.sha });
              }
              for (const item of tree.tree) {
                if (item.type === "blob" && item.path.startsWith("dist/") && !desiredPaths.has(item.path)) {
                  entries.push({ path: item.path, mode: item.mode, type: "blob", sha: null });
                }
              }

              const newTree = await request("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: commit.tree.sha, tree: entries }) });
              if (newTree.sha === commit.tree.sha) {
                console.log("dist is already up to date.");
                Deno.exit(0);
              }
              const newCommit = await request("/git/commits", { method: "POST", body: JSON.stringify({ message: "chore: update dist", tree: newTree.sha, parents: [pr.head.sha] }) });
              await request(`/git/refs/heads/${branch}`, { method: "PATCH", body: JSON.stringify({ sha: newCommit.sha, force: false }) });
              console.log(`Updated dist on ${branch}; CircleCI will check the generated commit.`);
            '
      - save-deps
      - store_artifacts:
          path: dist
          destination: dist

  release:
    resource_class: medium
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - restore-deps
      - attach_workspace:
          at: .
      - run:
          name: Publish GitHub Release
          command: deno run -A tasks/publishRelease.ts
      - save-deps
      - store_artifacts:
          path: dist
          destination: dist

  notify-workflow:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run:
          name: Send workflow result to Discord
          command: deno run -A tasks/notifyWorkflow.ts

  update-deno-deps:
    resource_class: small
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run:
          name: Open a pull request when Deno dependencies are outdated
          command: deno run -A tasks/updateDenoDeps.ts

workflows:
  ci:
    when: pipeline.parameters.run_ci and not pipeline.parameters.run_deps_update
    jobs:
      - lint
      - typecheck
      - test:
          filters: pipeline.parameters.skip_heavy == false
      - theme-check:
          filters: pipeline.parameters.skip_heavy == false
      - theme-lint:
          filters: pipeline.parameters.skip_heavy == false
      - manifest-check
      - ci-cd-check
      - build:
          filters: pipeline.parameters.skip_heavy == false
          requires:
            - lint
            - typecheck
            - test
            - theme-check
            - theme-lint
            - manifest-check
            - ci-cd-check
      - update-dist:
          requires:
            - build
      - release:
          requires:
            - build
          filters: pipeline.git.branch == "master" and (pipeline.event.name == "push" or pipeline.parameters.run_release)
      - notify-workflow:
          requires:
            - lint: terminal
            - typecheck: terminal
            - test: terminal
            - theme-check: terminal
            - theme-lint: terminal
            - manifest-check: terminal
            - ci-cd-check: terminal
            - build: terminal
            - update-dist: terminal
            - release: terminal

  deps-update:
    when: pipeline.parameters.run_deps_update and pipeline.git.branch == "master"
    jobs:
      - update-deno-deps
      - notify-workflow:
          requires:
            - update-deno-deps: terminal
