version: 2.1

jobs:
  lint:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task lint

  typecheck:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task typecheck

  test:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task test

  theme-check:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task theme:check

  theme-lint:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task theme:lint

  manifest-check:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task manifest:check

  ci-cd-check:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run:
          name: Check CI/CD files and referenced tasks
          command: |
            set -euo pipefail

            if [ "$CIRCLE_BRANCH" = "master" ]; then
              BASE="${CIRCLE_SHA1}^"
            else
              git fetch origin master
              BASE="$(git merge-base origin/master HEAD)"
            fi

            CHANGED=$(git diff --name-only "$BASE" HEAD)
            if ! printf '%s\n' "$CHANGED" | grep -Eq '^(\.circleci/|tasks/|deno\.json$)'; then
              echo "No CI/CD files changed; skipping focused checks."
              circleci-agent step halt
            fi

            deno eval -A '
              const version = "1.14.0";
              const response = await fetch(`https://api.github.com/repos/CircleCI-Public/cli/releases/tags/v${version}`);
              if (!response.ok) throw new Error(`Could not find CircleCI CLI ${version}: ${response.status}`);
              const release = await response.json();
              const asset = release.assets.find((item) => item.name.includes("linux_amd64") && item.name.endsWith(".tar.gz"));
              if (!asset) throw new Error(`Linux amd64 archive not found for CircleCI CLI ${version}`);
              const binary = await fetch(asset.browser_download_url);
              if (!binary.ok) throw new Error(`Could not download CircleCI CLI: ${binary.status}`);
              await Deno.writeFile("/tmp/circleci-cli.tar.gz", new Uint8Array(await binary.arrayBuffer()));
            '
            mkdir -p /tmp/circleci-cli
            tar -xzf /tmp/circleci-cli.tar.gz -C /tmp/circleci-cli
            CIRCLECI_CLI=$(find /tmp/circleci-cli -type f -name circleci -print -quit)
            if [ -z "$CIRCLECI_CLI" ]; then
              echo "CircleCI CLI binary was not found in the release archive."
              exit 1
            fi
            chmod +x "$CIRCLECI_CLI"
            "$CIRCLECI_CLI" config validate .circleci/config.yml

            deno eval -A '
              const config = JSON.parse(await Deno.readTextFile("deno.json"));
              const required = ["lint", "typecheck", "test", "theme:check", "theme:lint", "manifest:check", "build", "release"];
              const missing = required.filter((task) => !config.tasks?.[task]);
              if (missing.length) throw new Error(`Missing Deno tasks: ${missing.join(", ")}`);
              console.log("All CI tasks exist in deno.json.");
            '

            deno task typecheck

  build:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run:
          name: Build extension
          command: deno task build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  update-dist:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Update dist on same-repository pull requests
          command: |
            set -euo pipefail

            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request; dist is available as a build artifact."
              exit 0
            fi

            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN unavailable; keeping dist as an artifact only."
              exit 0
            fi

            PR_NUMBER="${CIRCLE_PULL_REQUEST##*/}"
            HEAD_REPO=$(PR_NUMBER="$PR_NUMBER" deno eval -A 'const response = await fetch(`https://api.github.com/repos/${Deno.env.get("CIRCLE_PROJECT_USERNAME")}/${Deno.env.get("CIRCLE_PROJECT_REPONAME")}/pulls/${Deno.env.get("PR_NUMBER")}`, { headers: { Authorization: `Bearer ${Deno.env.get("GITHUB_TOKEN")}`, Accept: "application/vnd.github+json" } }); if (!response.ok) throw new Error(`GitHub API returned ${response.status}`); const pr = await response.json(); console.log(pr.head.repo?.full_name ?? "");')
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            if [ "$HEAD_REPO" != "$REPO" ]; then
              echo "Pull request comes from a fork; dist is available as an artifact only."
              exit 0
            fi

            if [ -z "${CIRCLE_BRANCH:-}" ]; then
              echo "CircleCI branch is unavailable; skipping dist push."
              exit 0
            fi

            git config user.email "ci@circleci.com"
            git config user.name "circleci-bot"
            git add dist/
            if git diff --cached --quiet; then
              echo "dist is already up to date."
              exit 0
            fi

            git commit -m "chore: update dist [ci skip]"
            git fetch origin "$CIRCLE_BRANCH"
            git rebase "origin/$CIRCLE_BRANCH"
            git -c "http.extraheader=AUTHORIZATION: bearer $GITHUB_TOKEN" push "https://github.com/$REPO.git" "HEAD:$CIRCLE_BRANCH"
      - store_artifacts:
          path: dist
          destination: dist

  release:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Configure git
          command: |
            set -euo pipefail
            git fetch --tags origin
            git config user.email "ci@circleci.com"
            git config user.name "circleci-bot"
      - run:
          name: Calculate semantic version
          command: |
            set -euo pipefail
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_VERSION="0.0.0"
              RANGE="HEAD"
            else
              LATEST_VERSION="${LATEST_TAG#v}"
              RANGE="$LATEST_TAG..HEAD"
            fi

            COMMITS=$(git log --format='%s%n%b' "$RANGE")
            BUMP="patch"
            if printf '%s\n' "$COMMITS" | grep -qE '(^|[[:space:]])BREAKING CHANGE:' || printf '%s\n' "$COMMITS" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
              BUMP="major"
            elif printf '%s\n' "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP="minor"
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            TAG="v$NEW_VERSION"

            echo "export NEW_VERSION=$NEW_VERSION" >> "$BASH_ENV"
            echo "export TAG=$TAG" >> "$BASH_ENV"
            echo "export LATEST_TAG=$LATEST_TAG" >> "$BASH_ENV"
      - run:
          name: Publish GitHub Release
          command: |
            set -euo pipefail
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN is required to publish a GitHub Release."
              exit 1
            fi

            if [ -n "$LATEST_TAG" ]; then
              BODY=$(git log --format='* %s' "$LATEST_TAG..HEAD" | head -n 80)
            else
              BODY=$(git log --format='* %s' HEAD | head -n 80)
            fi

            RELEASE_BODY="$BODY" deno eval -A '
              const owner = Deno.env.get("CIRCLE_PROJECT_USERNAME")!;
              const repo = Deno.env.get("CIRCLE_PROJECT_REPONAME")!;
              const token = Deno.env.get("GITHUB_TOKEN")!;
              const tag = Deno.env.get("TAG")!;
              const api = `https://api.github.com/repos/${owner}/${repo}`;
              const headers = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" };

              const existing = await fetch(`${api}/releases/tags/${tag}`, { headers });
              if (existing.ok) {
                console.log(`Release ${tag} already exists.`);
                Deno.exit(0);
              }
              if (existing.status !== 404) throw new Error(`GitHub API returned ${existing.status}: ${await existing.text()}`);

              const ref = await fetch(`${api}/git/refs`, { method: "POST", headers, body: JSON.stringify({ ref: `refs/tags/${tag}`, sha: Deno.env.get("CIRCLE_SHA1") }) });
              if (!ref.ok && ref.status !== 422) throw new Error(`Tag creation failed (${ref.status}): ${await ref.text()}`);

              const release = await fetch(`${api}/releases`, { method: "POST", headers, body: JSON.stringify({ tag_name: tag, name: tag, body: Deno.env.get("RELEASE_BODY"), draft: false, prerelease: false }) });
              if (!release.ok) throw new Error(`GitHub Release failed (${release.status}): ${await release.text()}`);
              console.log(`Published ${tag}.`);
            '
      - store_artifacts:
          path: dist
          destination: dist

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test
      - theme-check
      - theme-lint
      - manifest-check
      - ci-cd-check
      - build:
          requires:
            - lint
            - typecheck
            - test
            - theme-check
            - theme-lint
            - manifest-check
            - ci-cd-check
      - update-dist:
          requires:
            - build
      - release:
          requires:
            - build
          filters:
            branches:
              only: master
