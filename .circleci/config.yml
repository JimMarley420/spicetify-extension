version: 2.1

jobs:
  lint:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task lint

  typecheck:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task typecheck

  test:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task test

  theme-check:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task theme:check

  theme-lint:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task theme:lint

  manifest-check:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run: deno task manifest:check

  ci-cd-check:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run:
          name: Check CI/CD files and referenced tasks
          command: |
            deno eval '
              const owner = Deno.env.get("CIRCLE_PROJECT_USERNAME")!;
              const repo = Deno.env.get("CIRCLE_PROJECT_REPONAME")!;
              const pullRequest = Deno.env.get("CIRCLE_PULL_REQUEST");
              const baseUrl = `https://api.github.com/repos/${owner}/${repo}`;
              const headers = { Accept: "application/vnd.github+json", "User-Agent": "artist-search-circleci" };
              const files: string[] = [];

              if (pullRequest) {
                const number = pullRequest.split("/").pop();
                for (let page = 1; ; page++) {
                  const response = await fetch(`${baseUrl}/pulls/${number}/files?per_page=100&page=${page}`, { headers });
                  if (!response.ok) throw new Error(`GitHub PR files API returned ${response.status}: ${await response.text()}`);
                  const pageFiles = await response.json();
                  files.push(...pageFiles.map((file: { filename: string }) => file.filename));
                  if (pageFiles.length < 100) break;
                }
              } else {
                const sha = Deno.env.get("CIRCLE_SHA1")!;
                const response = await fetch(`${baseUrl}/commits/${sha}`, { headers });
                if (!response.ok) throw new Error(`GitHub commit API returned ${response.status}: ${await response.text()}`);
                const commit = await response.json();
                files.push(...commit.files.map((file: { filename: string }) => file.filename));
              }

              const relevant = files.some((path) => /^\.circleci\//.test(path) || /^tasks\//.test(path) || path === "deno.json");
              if (!relevant) {
                console.log("No CI/CD files changed; skipping focused checks.");
                Deno.exit(0);
              }
              const config = JSON.parse(await Deno.readTextFile("deno.json"));
              const required = ["lint", "typecheck", "test", "theme:check", "theme:lint", "manifest:check", "build", "release"];
              const missing = required.filter((task) => !config.tasks?.[task]);
              if (missing.length) throw new Error(`Missing Deno tasks: ${missing.join(", ")}`);
              console.log("CI/CD files changed; all referenced tasks exist.");

              const child = new Deno.Command("deno", { args: ["task", "typecheck"], stdout: "inherit", stderr: "inherit" }).spawn();
              const result = await child.status;
              if (!result.success) throw new Error(`Deno typecheck failed with exit code ${result.code}`);
            '

  build:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - run:
          name: Build extension
          command: deno task build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  update-dist:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Update dist on same-repository pull requests
          command: |
            set -euo pipefail

            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request; dist is available as a build artifact."
              exit 0
            fi

            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN unavailable; keeping dist as an artifact only."
              exit 0
            fi

            PR_NUMBER="${CIRCLE_PULL_REQUEST##*/}"
            HEAD_REPO=$(PR_NUMBER="$PR_NUMBER" deno eval 'const response = await fetch(`https://api.github.com/repos/${Deno.env.get("CIRCLE_PROJECT_USERNAME")}/${Deno.env.get("CIRCLE_PROJECT_REPONAME")}/pulls/${Deno.env.get("PR_NUMBER")}`, { headers: { Authorization: `Bearer ${Deno.env.get("GITHUB_TOKEN")}`, Accept: "application/vnd.github+json" } }); if (!response.ok) throw new Error(`GitHub API returned ${response.status}`); const pr = await response.json(); console.log(pr.head.repo?.full_name ?? "");')
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            if [ "$HEAD_REPO" != "$REPO" ]; then
              echo "Pull request comes from a fork; dist is available as an artifact only."
              exit 0
            fi

            if [ -z "${CIRCLE_BRANCH:-}" ]; then
              echo "CircleCI branch is unavailable; skipping dist push."
              exit 0
            fi

            git config user.email "ci@circleci.com"
            git config user.name "circleci-bot"
            git add dist/
            if git diff --cached --quiet; then
              echo "dist is already up to date."
              exit 0
            fi

            git commit -m "chore: update dist [ci skip]"
            git fetch origin "$CIRCLE_BRANCH"
            git rebase "origin/$CIRCLE_BRANCH"
            git -c "http.extraheader=AUTHORIZATION: bearer $GITHUB_TOKEN" push "https://github.com/$REPO.git" "HEAD:$CIRCLE_BRANCH"
      - store_artifacts:
          path: dist
          destination: dist

  release:
    docker:
      - image: denoland/deno:2.7.11
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Configure git
          command: |
            set -euo pipefail
            git fetch --tags origin
            git config user.email "ci@circleci.com"
            git config user.name "circleci-bot"
      - run:
          name: Calculate semantic version
          command: |
            deno eval '
              const command = async (args: string[]) => {
                const result = await new Deno.Command("git", { args }).output();
                if (result.code !== 0) throw new Error(new TextDecoder().decode(result.stderr));
                return new TextDecoder().decode(result.stdout).trimEnd();
              };

              const tags = (await command(["tag", "--list", "v[0-9]*"]))
                .split("\n")
                .filter((tag) => /^v\d+\.\d+\.\d+$/.test(tag))
                .sort((left, right) => {
                  const a = left.slice(1).split(".").map(Number);
                  const b = right.slice(1).split(".").map(Number);
                  return b[0] - a[0] || b[1] - a[1] || b[2] - a[2];
                });
              const latestTag = tags[0] ?? "";
              const latestVersion = latestTag ? latestTag.slice(1).split(".").map(Number) : [0, 0, 0];
              const range = latestTag ? `${latestTag}..HEAD` : "HEAD";
              const log = await command(["log", "-z", "--format=%s%n%b", range]);
              const commits = log.split("\0").filter(Boolean).map((entry) => {
                const [subject = "", ...body] = entry.split("\n");
                return { subject, body };
              });

              const breaking = commits.some(({ subject, body }) =>
                /^[a-z]+(?:\([^)]*\))?!:/.test(subject) || body.some((line) => /^BREAKING CHANGE:/.test(line.trim()))
              );
              const feature = commits.some(({ subject }) => /^feat(?:\([^)]*\))?:/.test(subject));
              const bump = breaking ? "major" : feature ? "minor" : "patch";
              let [major, minor, patch] = latestVersion;
              if (bump === "major") [major, minor, patch] = [major + 1, 0, 0];
              else if (bump === "minor") [major, minor, patch] = [major, minor + 1, 0];
              else patch++;

              const version = `${major}.${minor}.${patch}`;
              const tag = `v${version}`;
              const bashEnv = Deno.env.get("BASH_ENV")!;
              await Deno.writeTextFile(bashEnv, `export NEW_VERSION=${version}\nexport TAG=${tag}\nexport LATEST_TAG=${latestTag}\n`, { append: true });
              console.log(`Latest tag: ${latestTag || "none"}; bump: ${bump}; next tag: ${tag}`);
            '
      - run:
          name: Publish GitHub Release
          command: |
            set -euo pipefail
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN is required to publish a GitHub Release."
              exit 1
            fi

            if [ -n "$LATEST_TAG" ]; then
              BODY=$(git log --format='* %s' "$LATEST_TAG..HEAD" | head -n 80)
            else
              BODY=$(git log --format='* %s' HEAD | head -n 80)
            fi

            RELEASE_BODY="$BODY" deno eval '
              const owner = Deno.env.get("CIRCLE_PROJECT_USERNAME")!;
              const repo = Deno.env.get("CIRCLE_PROJECT_REPONAME")!;
              const token = Deno.env.get("GITHUB_TOKEN")!;
              const tag = Deno.env.get("TAG")!;
              const api = `https://api.github.com/repos/${owner}/${repo}`;
              const headers = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" };

              const existing = await fetch(`${api}/releases/tags/${tag}`, { headers });
              if (existing.ok) {
                console.log(`Release ${tag} already exists.`);
                Deno.exit(0);
              }
              if (existing.status !== 404) throw new Error(`GitHub API returned ${existing.status}: ${await existing.text()}`);

              const ref = await fetch(`${api}/git/refs`, { method: "POST", headers, body: JSON.stringify({ ref: `refs/tags/${tag}`, sha: Deno.env.get("CIRCLE_SHA1") }) });
              if (!ref.ok && ref.status !== 422) throw new Error(`Tag creation failed (${ref.status}): ${await ref.text()}`);

              const release = await fetch(`${api}/releases`, { method: "POST", headers, body: JSON.stringify({ tag_name: tag, name: tag, body: Deno.env.get("RELEASE_BODY"), draft: false, prerelease: false }) });
              if (!release.ok) throw new Error(`GitHub Release failed (${release.status}): ${await release.text()}`);
              console.log(`Published ${tag}.`);
            '
      - store_artifacts:
          path: dist
          destination: dist

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test
      - theme-check
      - theme-lint
      - manifest-check
      - ci-cd-check
      - build:
          requires:
            - lint
            - typecheck
            - test
            - theme-check
            - theme-lint
            - manifest-check
            - ci-cd-check
      - update-dist:
          requires:
            - build
      - release:
          requires:
            - build
          filters:
            branches:
              only: master
