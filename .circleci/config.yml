version: 2.1

orbs:
  cli: circleci/circleci-cli@0.1.11

parameters:
  run_ci:
    type: boolean
    default: true
  run_deps_update:
    type: boolean
    default: false
  run_release:
    type: boolean
    default: false
  skip_heavy:
    type: boolean
    default: false

executors:
  deno-small:
    resource_class: small
    docker:
      - image: denoland/deno:2.9.8
  deno-medium:
    resource_class: medium
    docker:
      - image: denoland/deno:2.9.8

commands:
  # A single cache shared by every job. The Deno cache is content-addressed,
  # so jobs can safely restore the same archive and download only what is
  # missing. Keying by the lockfile checksum invalidates it on dependency
  # changes, and dropping the branch/job components avoids keeping one
  # duplicate cache per job.
  restore-deps:
    steps:
      - restore_cache:
          keys:
            - v2-deno-2.9.8-{{ checksum "deno.lock" }}
            - v2-deno-2.9.8-
  save-deps:
    steps:
      - save_cache:
          key: v2-deno-2.9.8-{{ checksum "deno.lock" }}
          paths:
            - ~/.cache/deno
            - node_modules

jobs:
  lint:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task lint
      - save-deps

  typecheck:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task typecheck
      - save-deps

  lockfile-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run:
          name: Verify deno.lock is up to date
          command: deno ci
      - save-deps

  test:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: mkdir -p test-results
      - run:
          name: Run tests
          # The Deno image does not ship git, so the checkout has no history
          # to diff against. The full suite is small and fast; run it
          # everywhere rather than silently falling back to it.
          command: deno task test
      - run:
          name: Generate LCOV coverage report
          command: deno coverage --lcov --output=coverage.lcov coverage/ && deno task coverage:check
          when: always
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage.lcov
          destination: coverage.lcov
      - save-deps

  theme-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task theme:check
      - save-deps

  theme-lint:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task theme:lint
      - save-deps

  manifest-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task manifest:check
      - save-deps

  ci-cd-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run:
          name: Check CI/CD files and referenced tasks
          command: deno run -A tasks/ciCdCheck.ts
      - save-deps

  commit-lint:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Lint commit messages
          command: deno task lint:commits

  security-audit:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run:
          name: Fail on critical dependency vulnerabilities
          command: deno audit --level critical --ignore-registry-errors
      - run:
          name: Save full dependency audit report
          command: deno audit --ignore-registry-errors > audit.log 2>&1 || true
          when: always
      - store_artifacts:
          path: audit.log
          destination: audit.log
      - save-deps

  secret-scan:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Scan tracked files for secrets
          command: deno run -A tasks/scanSecrets.ts

  config-validate:
    executor: cli/default
    steps:
      - checkout
      - run:
          name: Validate CircleCI config
          command: circleci config validate .circleci/config.yml

  build:
    executor: deno-medium
    steps:
      - checkout
      - restore-deps
      - run:
          name: Build extension
          command: deno task release --skip-check
      - save-deps
      - persist_to_workspace:
          root: .
          paths:
            - dist

  update-dist:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - attach_workspace:
          at: .
      - run:
          name: Update dist on same-repository pull requests
          command: deno run -A tasks/updateDist.ts
      - save-deps
      - store_artifacts:
          path: dist
          destination: dist

  release:
    executor: deno-medium
    steps:
      - checkout
      - restore-deps
      - attach_workspace:
          at: .
      - run:
          name: Publish GitHub Release
          command: deno run -A tasks/publishRelease.ts
      - save-deps
      - store_artifacts:
          path: dist
          destination: dist

  notify-workflow:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Send workflow result to Discord
          command: deno run -A tasks/notifyWorkflow.ts

  update-deno-deps:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Open a pull request when Deno dependencies are outdated
          command: deno run -A tasks/updateDenoDeps.ts

workflows:
  ci:
    when: pipeline.parameters.run_ci and not pipeline.parameters.run_deps_update
    max_auto_reruns: 2
    jobs:
      # Stage 1 - Quality checks. Every job runs in parallel; the always-on
      # subset below is required by the later stages, while theme-check and
      # theme-lint are optional heavy jobs.
      - lint
      - typecheck
      - lockfile-check
      - manifest-check
      - config-validate
      - commit-lint
      - ci-cd-check
      - theme-check:
          filters: pipeline.parameters.skip_heavy == false
      - theme-lint:
          filters: pipeline.parameters.skip_heavy == false

      # Stage 2 - Tests and security, gated on the always-on quality checks.
      - test:
          filters: pipeline.parameters.skip_heavy == false
          requires:
            - lint
            - typecheck
            - lockfile-check
            - manifest-check
            - config-validate
            - commit-lint
            - ci-cd-check
      - security-audit:
          requires:
            - lint
            - typecheck
            - lockfile-check
            - manifest-check
            - config-validate
            - commit-lint
            - ci-cd-check
      - secret-scan:
          requires:
            - lint
            - typecheck
            - lockfile-check
            - manifest-check
            - config-validate
            - commit-lint
            - ci-cd-check

      # Stage 3 - Build and artifacts, gated on tests and security.
      - build:
          filters: pipeline.parameters.skip_heavy == false
          requires:
            - theme-check
            - theme-lint
            - test
            - security-audit
            - secret-scan

      # Stage 4 - Deploy and distribution.
      - update-dist:
          requires:
            - build
      - release:
          requires:
            - build
          filters: pipeline.git.branch == "master" and (pipeline.event.name == "push" or pipeline.parameters.run_release)
      - notify-workflow:
          requires:
            - lint: terminal
            - typecheck: terminal
            - lockfile-check: terminal
            - test: terminal
            - theme-check: terminal
            - theme-lint: terminal
            - manifest-check: terminal
            - ci-cd-check: terminal
            - commit-lint: terminal
            - security-audit: terminal
            - secret-scan: terminal
            - config-validate: terminal
            - build: terminal
            - update-dist: terminal
            - release: terminal

  deps-update:
    when: pipeline.parameters.run_deps_update and pipeline.git.branch == "master"
    jobs:
      - update-deno-deps
      - notify-workflow:
          requires:
            - update-deno-deps: terminal
