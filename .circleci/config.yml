version: 2.1

orbs:
  cli: circleci/circleci-cli@0.1.11

parameters:
  run_ci:
    type: boolean
    default: true
  run_deps_update:
    type: boolean
    default: false
  run_release:
    type: boolean
    default: false
  skip_heavy:
    type: boolean
    default: false

executors:
  deno-small:
    resource_class: small
    docker:
      - image: denoland/deno:2.9.8
  deno-medium:
    resource_class: medium
    docker:
      - image: denoland/deno:2.9.8

commands:
  restore-deps:
    steps:
      - restore_cache:
          keys:
            - v1-deps-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-{{ checksum "deno.lock" }}
            - v1-deps-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-
            - v1-deps-
  save-deps:
    steps:
      - save_cache:
          key: v1-deps-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-{{ checksum "deno.lock" }}
          paths:
            - ~/.cache/deno
            - node_modules

jobs:
  lint:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task lint
      - save-deps

  typecheck:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task typecheck
      - save-deps

  lockfile-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run:
          name: Verify deno.lock is up to date
          command: deno ci
      - save-deps

  test:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: mkdir -p test-results
      - run:
          name: Run tests
          command: |
            if [ -n "$CIRCLE_PULL_REQUEST" ] && git rev-parse --verify --quiet origin/master > /dev/null; then
              deno task test:affected
            else
              deno task test
            fi
      - run:
          name: Generate LCOV coverage report
          command: deno coverage --lcov --output=coverage.lcov coverage/ && deno task coverage:check
          when: always
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage.lcov
          destination: coverage.lcov
      - save-deps

  theme-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task theme:check
      - save-deps

  theme-lint:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task theme:lint
      - save-deps

  manifest-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run: deno task manifest:check
      - save-deps

  ci-cd-check:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run:
          name: Check CI/CD files and referenced tasks
          command: deno run -A tasks/ciCdCheck.ts
      - save-deps

  commit-lint:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Lint commit messages
          command: deno task lint:commits

  security-audit:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - run:
          name: Fail on critical dependency vulnerabilities
          command: deno audit --level critical --ignore-registry-errors
      - run:
          name: Save full dependency audit report
          command: deno audit --ignore-registry-errors > audit.log 2>&1 || true
          when: always
      - store_artifacts:
          path: audit.log
          destination: audit.log
      - save-deps

  secret-scan:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Scan tracked files for secrets
          command: deno run -A tasks/scanSecrets.ts

  config-validate:
    executor: cli/default
    steps:
      - checkout
      - run:
          name: Validate CircleCI config
          command: circleci config validate .circleci/config.yml

  build:
    executor: deno-medium
    steps:
      - checkout
      - restore-deps
      - run:
          name: Build extension
          command: deno task release --skip-check
      - save-deps
      - persist_to_workspace:
          root: .
          paths:
            - dist

  update-dist:
    executor: deno-small
    steps:
      - checkout
      - restore-deps
      - attach_workspace:
          at: .
      - run:
          name: Update dist on same-repository pull requests
          command: deno run -A tasks/updateDist.ts
      - save-deps
      - store_artifacts:
          path: dist
          destination: dist

  release:
    executor: deno-medium
    steps:
      - checkout
      - restore-deps
      - attach_workspace:
          at: .
      - run:
          name: Publish GitHub Release
          command: deno run -A tasks/publishRelease.ts
      - save-deps
      - store_artifacts:
          path: dist
          destination: dist

  notify-workflow:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Send workflow result to Discord
          command: deno run -A tasks/notifyWorkflow.ts

  update-deno-deps:
    executor: deno-small
    steps:
      - checkout
      - run:
          name: Open a pull request when Deno dependencies are outdated
          command: deno run -A tasks/updateDenoDeps.ts

workflows:
  ci:
    when: pipeline.parameters.run_ci and not pipeline.parameters.run_deps_update
    max_auto_reruns: 2
    jobs:
      - lint
      - typecheck
      - lockfile-check
      - test:
          filters: pipeline.parameters.skip_heavy == false
      - theme-check:
          filters: pipeline.parameters.skip_heavy == false
      - theme-lint:
          filters: pipeline.parameters.skip_heavy == false
      - manifest-check
      - ci-cd-check
      - commit-lint:
          filters:
            branches:
              ignore: master
      - security-audit
      - secret-scan
      - config-validate
      - build:
          filters: pipeline.parameters.skip_heavy == false
          requires:
            - lint
            - typecheck
            - lockfile-check
            - test
            - theme-check
            - theme-lint
            - manifest-check
            - ci-cd-check
            - commit-lint
            - security-audit
            - secret-scan
            - config-validate
      - update-dist:
          requires:
            - build
      - release:
          requires:
            - build
          filters: pipeline.git.branch == "master" and (pipeline.event.name == "push" or pipeline.parameters.run_release)
      - notify-workflow:
          requires:
            - lint: terminal
            - typecheck: terminal
            - lockfile-check: terminal
            - test: terminal
            - theme-check: terminal
            - theme-lint: terminal
            - manifest-check: terminal
            - ci-cd-check: terminal
            - commit-lint: terminal
            - security-audit: terminal
            - secret-scan: terminal
            - config-validate: terminal
            - build: terminal
            - update-dist: terminal
            - release: terminal

  deps-update:
    when: pipeline.parameters.run_deps_update and pipeline.git.branch == "master"
    jobs:
      - update-deno-deps
      - notify-workflow:
          requires:
            - update-deno-deps: terminal
